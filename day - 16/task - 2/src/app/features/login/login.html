<main class="page">
  <h1>Sign in</h1>
  <p class="subtitle">Sign in to add a quote.</p>

  <form (submit)="$event.preventDefault(); login()">
    <label for="email">Email</label>
    <input id="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
    />

    <button type="submit" [disabled]="pending()">
      {{ pending() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  @if (error(); as err) {
    <p class="state error" role="alert">{{ err.message }}</p>
  }
</main>
